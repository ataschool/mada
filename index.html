<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ATA SCHOOL | Always Think Ahead</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --color-primary: #101b3b;
            --color-gold: #c9a03d;
            --bg-primary: #fdfdfd;
            --bg-secondary: #f4f6f4;
            --bg-card: #ffffff;
            --text-primary: #101b3b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --header-bg: rgba(255, 255, 255, 0.9);
        }
        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --header-bg: rgba(15, 23, 42, 0.9);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); margin: 0; transition: background-color 0.3s, color 0.3s; }
        .serif-title { font-family: 'Playfair Display', serif; font-weight: 700; }
        .btn-premium { background-color: var(--color-primary); color: white; border: 1px solid var(--color-primary); transition: all 0.4s; cursor: pointer; }
        .btn-premium:hover { background-color: transparent; color: var(--color-primary); border-color: var(--color-gold); transform: translateY(-2px); }
        .btn-gold-outline { border: 1px solid var(--color-gold); color: var(--color-primary); transition: all 0.3s; background: white; cursor: pointer; }
        .btn-gold-outline:hover { background-color: var(--color-gold); color: white; }
        header { transition: background-color 0.5s, box-shadow 0.5s, transform 0.3s; background-color: var(--header-bg); backdrop-filter: blur(6px); }
        header.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header.hide-nav { transform: translateY(-100%); }
        .nav-icon { transition: all 0.25s; display: inline-block; font-size: 1.4rem; color: var(--text-primary); cursor: pointer; }
        .nav-icon:hover { transform: scale(1.15); color: var(--color-gold); }
        .nav-icon.active { color: var(--color-gold); }
        #backToTop { position: fixed; bottom: 30px; right: 30px; z-index: 50; background: var(--color-primary); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.4s; }
        #backToTop.show { opacity: 1; }
        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s, transform 0.8s; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .swiper { width: 100%; padding-top: 50px; padding-bottom: 70px; }
        .swiper-slide { width: 320px; height: 430px; border-radius: 1rem; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-color); }
        .swiper-slide-active { border-color: var(--color-gold); }
        .swiper-button-next, .swiper-button-prev { color: var(--color-gold); background: white; width: 45px; height: 45px; border-radius: 50%; }
        .swiper-pagination-bullet-active { background: var(--color-gold) !important; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal.active { visibility: visible; opacity: 1; }
        .glass-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; }
        .btn-navy { background: #101b3b; color: white; }
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #101b3b; color: white; padding: 16px 24px; border-radius: 12px; border-left: 4px solid #c9a03d; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .dark input, .dark select, .dark textarea { background-color: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
    </style>
</head>
<body>

<div id="app">
    <div id="pageLoader" class="fixed inset-0 z-[200] flex items-center justify-center hidden">
        <div class="text-center"><div class="w-12 h-12 border-4 border-[var(--color-gold)] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p class="text-sm" style="color: var(--text-secondary);">Chargement...</p></div>
    </div>

    <header id="mainHeader" class="w-full sticky top-0 z-50 border-b" style="border-color: var(--border-color);">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="serif-title text-lg tracking-wider" style="color: var(--text-primary);">ATA <span class="text-[#c9a03d]">SCHOOL</span></span>
                <span class="hidden md:inline-block text-[10px] font-medium tracking-widest uppercase ml-2" style="color: var(--text-secondary);">Always Think Ahead</span>
            </div>
            <nav class="hidden md:flex items-center gap-6 ml-auto">
                <a href="#" onclick="navigateTo('home')" class="nav-icon" data-page="home"><i class="fa-solid fa-building-columns"></i></a>
                <a href="#" onclick="navigateTo('courses')" class="nav-icon" data-page="courses"><i class="fa-solid fa-chalkboard-user"></i></a>
                <a href="#" onclick="navigateTo('videos')" class="nav-icon" data-page="videos"><i class="fa-solid fa-circle-play"></i></a>
                <a href="#" onclick="navigateTo('messages')" class="nav-icon" data-page="messages"><i class="fa-solid fa-message"></i></a>
                <a href="#" onclick="navigateTo('resources')" class="nav-icon" data-page="resources"><i class="fa-solid fa-box-archive"></i></a>
            </nav>
            <div id="authButtons" class="flex items-center gap-4 ml-4"></div>
        </div>
    </header>

    <div id="mainContent"></div>

    <div id="authModal" class="modal">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-12 w-full max-w-4xl min-h-[580px] relative">
            <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-[#101b3b] text-xl z-10"><i class="fa-solid fa-xmark"></i></button>
            <div class="md:col-span-7 p-8 lg:p-12 flex flex-col justify-between" id="authFormContainer"></div>
            <div class="md:col-span-5 bg-gradient-to-br from-[#101b3b] to-[#0a1126] p-8 text-white flex flex-col justify-between relative overflow-hidden" id="authDecor"></div>
        </div>
    </div>

    <footer id="mainFooter" class="bg-[#0b1122] text-gray-400 pt-16 pb-8 border-t-2 border-[var(--color-gold)]">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-12 mb-16">
            <div class="flex flex-col gap-4"><div><span class="inline-block bg-[#101b3b] text-[var(--color-gold)] font-bold px-5 py-2 rounded text-sm tracking-widest border border-gray-800">ATA</span></div><p class="text-sm text-gray-400 mt-2 max-w-sm leading-relaxed">ATA School – Always Think Ahead. Plateforme éducative d'excellence.</p></div>
            <div><h3 class="text-white font-bold text-sm tracking-wider uppercase mb-6 relative after:content-[''] after:absolute after:bottom-[-6px] after:left-0 after:w-6 after:h-[2px] after:bg-[var(--color-gold)]">Liens rapides</h3><ul class="space-y-3 text-sm"><li><a href="#" class="hover:text-[var(--color-gold)] transition flex items-center gap-2">Accueil</a></li><li><a href="#" class="hover:text-[var(--color-gold)] transition flex items-center gap-2">Cours</a></li><li><a href="#" class="hover:text-[var(--color-gold)] transition flex items-center gap-2">Vidéos</a></li><li><a href="#" class="hover:text-[var(--color-gold)] transition flex items-center gap-2">Téléchargements</a></li></ul></div>
            <div><h3 class="text-white font-bold text-sm tracking-wider uppercase mb-6 relative after:content-[''] after:absolute after:bottom-[-6px] after:left-0 after:w-6 after:h-[2px] after:bg-[var(--color-gold)]">Newsletter</h3><p class="text-sm mb-4">Restez informé de nos actualités</p><form class="flex w-full max-w-md bg-[#162038] rounded-lg overflow-hidden p-1 border border-gray-800"><input type="email" placeholder="Votre email" class="w-full bg-transparent px-4 py-2 text-sm text-white focus:outline-none placeholder-gray-500"><button type="submit" class="bg-[var(--color-gold)] text-[#101b3b] font-bold px-5 py-2 rounded-md text-sm hover:bg-[#b08b30] transition shrink-0">S'abonner</button></form><div class="flex items-center gap-5 mt-6" id="footerSocialLinks"></div></div>
        </div>
        <div class="max-w-7xl mx-auto px-6 pt-8 border-t border-gray-900 text-center text-xs text-gray-600 tracking-wider">&copy; 2026 ATA SCHOOL – Always Think Ahead. Tous droits réservés.</div>
    </footer>

    <div id="backToTop"><i class="fa-solid fa-arrow-up"></i></div>
    <div id="toastContainer"></div>
</div>

<script>
// ==================== CONFIGURATION FIREBASE (À REMPLACER PAR VOS PROPRES CLÉS) ====================
const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "VOTRE_PROJET.firebaseapp.com",
    projectId: "VOTRE_PROJET",
    storageBucket: "VOTRE_PROJET.appspot.com",
    messagingSenderId: "VOTRE_SENDER_ID",
    appId: "VOTRE_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

// ==================== STOCKAGE LOCAL ====================
const STORAGE_USERS = "ata_users";
const STORAGE_COURSES = "ata_courses";
const STORAGE_VIDEOS = "ata_videos";
const STORAGE_PDFS = "ata_pdfs";
const STORAGE_CONFERENCES = "ata_conferences";
const STORAGE_CHAT = "liveChatMessages";
const STORAGE_CAROUSEL = "ata_carousel_slides";
const STORAGE_SETTINGS = "ata_settings";

(function initDefaultData() {
    if (!localStorage.getItem(STORAGE_USERS)) localStorage.setItem(STORAGE_USERS, JSON.stringify([{ id:1, name:"Admin ATA", email:"admin@ataschool.edu", password:"admin123", role:"admin", subscribed:true, photo:"", subscription:{ status:'none' }, createdAt:new Date().toISOString() }]));
    if (!localStorage.getItem(STORAGE_COURSES)) localStorage.setItem(STORAGE_COURSES, JSON.stringify([{ id:1, titre:"Anglais Débutant", langue:"Anglais", niveau:"Débutant", duree:"12 sem", prix:"85 000 Ar", image:"https://images.pexels.com/photos/1181675/pexels-photo-1181675.jpeg?w=400", accessLevel:'public', views:0 }]));
    if (!localStorage.getItem(STORAGE_VIDEOS)) localStorage.setItem(STORAGE_VIDEOS, JSON.stringify([{ id:1, titre:"Greetings in English", url:"https://www.youtube.com/embed/9nQ9P9vW8bE", thumbnail:"", accessLevel:'public' }]));
    if (!localStorage.getItem(STORAGE_PDFS)) localStorage.setItem(STORAGE_PDFS, JSON.stringify([{ id:1, nom:"Manuel de Grammaire", categorie:"Cours", downloads:0, accessLevel:'public', image:"", url:"#" }]));
    if (!localStorage.getItem(STORAGE_CONFERENCES)) localStorage.setItem(STORAGE_CONFERENCES, JSON.stringify([]));
    if (!localStorage.getItem(STORAGE_CHAT)) localStorage.setItem(STORAGE_CHAT, JSON.stringify([]));
    if (!localStorage.getItem(STORAGE_CAROUSEL)) localStorage.setItem(STORAGE_CAROUSEL, JSON.stringify([]));
    if (!localStorage.getItem(STORAGE_SETTINGS)) localStorage.setItem(STORAGE_SETTINGS, JSON.stringify({ facebook:'', twitter:'', linkedin:'', instagram:'', whatsapp:'' }));
})();

function getUsers() { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || []; }
function saveUsers(users) { localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }
function getCurrentUser() { return JSON.parse(localStorage.getItem('currentUser')); }
function setCurrentUser(user) { localStorage.setItem('currentUser', JSON.stringify(user)); }
function logout() { if (confirm('Voulez-vous vraiment vous déconnecter ?')) { localStorage.removeItem('currentUser'); currentPage = 'home'; renderApp(); window.scrollTo(0,0); showToast('Vous avez été déconnecté avec succès', 'info'); } }

let currentPage = 'home';
function getUserAccessLevel() { const u = getCurrentUser(); if (!u) return 'visitor'; if (u.role === 'admin') return 'admin'; if (u.subscription?.status === 'active') return 'premium'; return 'standard'; }
function canAccessContent(c) { const level = getUserAccessLevel(); if (level === 'admin' || level === 'premium') return true; if (level === 'standard') return (c.accessLevel||'public') !== 'premium'; return (c.accessLevel||'public') === 'public'; }
function renderAccessBadge(c) { const l = c.accessLevel||'public'; if (l==='premium') return '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full ml-1">🔒 Premium</span>'; if (l==='members') return '<span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full ml-1">👤 Membres</span>'; return ''; }

function navigateTo(page) {
    if (page === 'home' || page === 'premium' || page === 'favorites') { currentPage = page; renderApp(); return; }
    if ((page === 'videos' || page === 'courses' || page === 'messages' || page === 'resources') && !getCurrentUser()) { openAuthModal('login'); return; }
    currentPage = page; renderApp();
}

function showLoader() { document.getElementById('pageLoader')?.classList.remove('hidden'); }
function hideLoader() { setTimeout(() => { document.getElementById('pageLoader')?.classList.add('hidden'); }, 300); }

function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast font-medium ${type==='error'?'border-red-500':''}`;
    toast.innerHTML = `<span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

// ==================== RENDU PRINCIPAL ====================
function renderApp() {
    showLoader();
    const user = getCurrentUser();
    const mainContent = document.getElementById('mainContent');
    const authButtons = document.getElementById('authButtons');
    const footer = document.getElementById('mainFooter');
    if (user) {
        authButtons.innerHTML = `<button onclick="toggleDarkMode()" class="text-gray-600 hover:text-[#c9a03d] transition mr-2"><i class="fa-solid fa-moon text-lg"></i></button><button onclick="logout()" class="btn-premium px-5 py-2 rounded-full text-xs font-bold tracking-wider uppercase">Déconnexion</button>`;
    } else {
        authButtons.innerHTML = `<button onclick="toggleDarkMode()" class="text-gray-600 hover:text-[#c9a03d] transition mr-2"><i class="fa-solid fa-moon text-lg"></i></button><button onclick="openAuthModal('login')" class="btn-premium px-5 py-2 rounded-full text-xs font-bold tracking-wider uppercase">Se connecter</button>`;
    }
    document.querySelectorAll('.nav-icon').forEach(icon => icon.classList.toggle('active', icon.getAttribute('data-page') === currentPage));
    switch (currentPage) {
        case 'home': mainContent.innerHTML = user?.role === 'admin' ? renderAdminDashboard() : renderHomePage(); footer.style.display = user?.role === 'admin' ? 'none' : 'block'; if (user?.role === 'admin') initAdminDashboard(); else if (!user) { initSwiper(); initReveal(); } break;
        case 'videos': mainContent.innerHTML = renderVideoCourses(); footer.style.display = 'block'; setTimeout(fillVideoGrid, 50); break;
        case 'courses': mainContent.innerHTML = renderLiveClass(); footer.style.display = 'block'; break;
        case 'messages': mainContent.innerHTML = renderMessages(); footer.style.display = 'none'; break;
        case 'resources': mainContent.innerHTML = renderResources(); footer.style.display = 'block'; setTimeout(fillResourcesGrid, 50); break;
    }
    updateFooterLinks();
    initHeaderScroll();
    hideLoader();
}

// ==================== PAGES ====================
function renderHomePage() { return `<main><section class="min-h-[calc(100vh-80px)] flex flex-col lg:flex-row bg-[var(--bg-secondary)]"><div class="w-full lg:w-[55%] flex flex-col justify-between p-8 lg:p-16 xl:p-24"><div class="mb-8 lg:mb-0 reveal"><img src="IMG.jpg" alt="Logo" class="h-28 w-auto object-contain" onerror="this.style.display='none'"></div><div class="my-auto max-w-xl"><h1 class="serif-title text-5xl lg:text-7xl text-[#101b3b] leading-[1.05] tracking-tight reveal">ATA SCHOOL</h1><p class="text-lg lg:text-xl text-gray-600 mt-6 font-medium leading-relaxed reveal" style="transition-delay:0.1s;">Always Think Ahead – La plateforme qui élève vos compétences</p><div class="flex flex-wrap gap-4 mt-10 reveal" style="transition-delay:0.2s;"><button class="btn-premium px-8 py-4 rounded-full font-bold text-sm shadow-lg flex items-center gap-2" onclick="navigateTo('videos')"><i class="fas fa-graduation-cap"></i> Explorer les cours</button><button class="btn-gold-outline px-8 py-4 rounded-full font-bold text-sm flex items-center gap-2" onclick="openAuthModal('login')"><i class="fas fa-right-to-bracket"></i> Se connecter</button></div></div><div class="pt-8 border-t border-gray-200/60 flex items-center gap-4 text-xs tracking-wider uppercase text-gray-400 font-bold reveal"><span class="text-[var(--color-gold)]">★ ★ ★ ★ ★</span> Plateforme d'apprentissage d'excellence</div></div><div class="w-full lg:w-[45%] relative min-h-[400px] lg:min-h-0 bg-gray-200"><img src="Gemini_Generated_Image_pymdofpymdofpymd.png" alt="Formateur" class="absolute inset-0 w-full h-full object-cover object-center lg:object-right"><div class="absolute inset-0 bg-gradient-to-t lg:bg-gradient-to-r from-[var(--color-bg-light)]/40 via-transparent to-transparent"></div></div></section><section class="py-24 bg-white overflow-hidden"><div class="max-w-7xl mx-auto px-6"><div class="text-center mb-12 reveal"><span class="text-[var(--color-gold)] font-bold uppercase tracking-widest text-xs">Catalogue</span><h2 class="serif-title text-3xl lg:text-5xl text-[#101b3b] mt-2">📚 Nos Cours Populaires</h2><div class="w-16 h-1 bg-[var(--color-gold)] mx-auto mt-4 rounded-full"></div></div><div class="swiper courseSwiper reveal"><div class="swiper-wrapper" id="coursesCarouselWrapper"></div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div></div></section></main>`; }
function renderVideoCourses() { return `<main class="flex-1 max-w-7xl w-full mx-auto px-6 py-12"><div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12"><div><h1 class="serif-title text-4xl lg:text-5xl text-[#101b3b] font-bold">Video Courses Library</h1><p class="text-gray-500 mt-2 max-w-xl text-sm">Unlock your potential with our comprehensive collection of expert-led video lessons.</p></div><div class="w-full md:w-80 relative"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i><input type="text" placeholder="Search..." class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm"></div></div><div class="flex flex-col lg:flex-row gap-8"><aside class="w-full lg:w-64 shrink-0 flex flex-col gap-6"><div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm"><div class="mb-6"><h3 class="font-bold text-sm uppercase text-[#101b3b] mb-4">Subjects</h3><div class="space-y-3"><label class="flex items-center gap-3 text-sm font-medium text-gray-600 cursor-pointer"><input type="checkbox" checked class="custom-checkbox w-4 h-4 rounded"> Anglais</label><label class="flex items-center gap-3 text-sm font-medium text-gray-600 cursor-pointer"><input type="checkbox" checked class="custom-checkbox w-4 h-4 rounded"> Français</label></div></div><hr class="border-gray-100 my-4"><div><h3 class="font-bold text-sm uppercase text-[#101b3b] mb-4">Difficulty</h3><div class="space-y-3"><label class="flex items-center gap-3 text-sm font-medium text-gray-600 cursor-pointer"><input type="radio" name="difficulty" checked class="custom-checkbox w-4 h-4"> Débutant</label><label class="flex items-center gap-3 text-sm font-medium text-gray-600 cursor-pointer"><input type="radio" name="difficulty" class="custom-checkbox w-4 h-4"> Intermédiaire</label><label class="flex items-center gap-3 text-sm font-medium text-gray-600 cursor-pointer"><input type="radio" name="difficulty" class="custom-checkbox w-4 h-4"> Avancé</label></div></div></div></aside><div class="flex-1"><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="videoGridContainer"></div></div></div></main>`; }
function fillVideoGrid() { const container = document.getElementById('videoGridContainer'); if (!container) return; const videos = JSON.parse(localStorage.getItem(STORAGE_VIDEOS)) || []; container.innerHTML = videos.map(v => { const canAccess = canAccessContent(v); return `<div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between group hover:border-[var(--color-gold)]/40 transition"><div class="relative aspect-video w-full bg-gray-900 overflow-hidden"><img src="${v.thumbnail||'https://images.pexels.com/photos/373543/pexels-photo-373543.jpeg?w=500'}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition duration-500" alt="${v.titre}">${!canAccess?'<div class="absolute inset-0 bg-black/40 flex items-center justify-center"><div class="text-center text-white"><i class="fa-solid fa-lock text-3xl mb-2"></i><p class="text-xs font-bold uppercase">Premium</p><button onclick="showPremiumModal()" class="mt-2 bg-[var(--color-gold)] text-[#101b3b] text-[10px] font-bold px-3 py-1.5 rounded-full">Débloquer</button></div></div>':''}</div><div class="p-5 flex-1 flex flex-col justify-between"><div><span class="bg-[#c9a03d]/10 text-[var(--color-gold)] text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-1 rounded-md">${v.langue||''} ${renderAccessBadge(v)}</span><h2 class="font-bold text-[#101b3b] text-base mt-2.5 line-clamp-1">${v.titre}</h2></div><div class="mt-5 pt-4 border-t border-gray-50 flex items-center justify-end">${canAccess?`<a href="${v.url}" target="_blank" class="border border-[#101b3b] text-[#101b3b] hover:bg-[#101b3b] hover:text-white transition rounded-lg text-xs font-bold px-4 py-2">Regarder</a>`:`<button onclick="showPremiumModal()" class="bg-[var(--color-gold)] text-[#101b3b] hover:bg-[#b08b30] transition rounded-lg text-xs font-bold px-4 py-2 flex items-center gap-1"><i class="fa-solid fa-lock"></i> Premium</button>`}</div></div></div>`; }).join(''); }
function renderLiveClass() { return `<main class="flex-1 max-w-7xl w-full mx-auto px-6 py-10"><div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start"><div class="lg:col-span-2 flex flex-col gap-6"><div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-lg group"><img src="https://images.pexels.com/photos/256541/pexels-photo-256541.jpeg?w=1000" class="w-full h-full object-cover opacity-80" alt="Live"><div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex flex-col justify-between p-6"><div class="flex items-center justify-between"><span class="bg-red-500 text-white font-bold text-[10px] uppercase px-2.5 py-1 rounded-md">Live</span><span class="bg-black/60 text-white text-xs px-3 py-1.5 rounded-lg"><i class="fa-regular fa-eye"></i> 1,420 watching</span></div><div class="flex items-center justify-between text-white/90"><a href="https://meet.google.com/new" target="_blank" class="bg-[var(--color-gold)] text-[#101b3b] text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-[#b08b30] transition flex items-center gap-2"><i class="fa-solid fa-video"></i> Rejoindre</a></div></div></div><div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm"><span class="bg-[#c9a03d]/10 text-[var(--color-gold)] text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-1 rounded-md">Organic Chemistry</span><h1 class="serif-title text-[#101b3b] text-2xl lg:text-3xl font-bold mt-3">Advanced Molecular Bonding Theories</h1><p class="text-xs lg:text-sm text-gray-400 mt-2">Welcome to today's intensive session.</p></div></div><div class="bg-white rounded-2xl border border-gray-100 shadow-sm flex flex-col h-[560px] lg:h-[536px]"><div class="p-4 border-b border-gray-100"><h3 class="font-bold text-sm text-[#101b3b]">Live Community Chat</h3></div><div class="flex-1 p-4 overflow-y-auto space-y-4 chat-scroll bg-gray-50/40" id="chatMessages"></div><div class="p-3 border-t border-gray-100 bg-white rounded-b-2xl"><form id="chatForm" class="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2 border"><input type="text" id="chatInput" placeholder="Message..." class="flex-1 bg-transparent text-xs"><button type="submit" class="text-[var(--color-gold)]"><i class="fa-solid fa-paper-plane"></i></button></form></div></div></div></main>`; }
function renderResources() { return `<main><section class="bg-[#101b3b] text-white py-16 lg:py-20"><div class="max-w-7xl mx-auto px-6"><h1 class="serif-title text-4xl lg:text-6xl font-bold">Download Center</h1><p class="text-gray-300 mt-4">Access our comprehensive library.</p></div></section><div class="max-w-7xl mx-auto px-6 py-12"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="resourcesGrid"></div><section class="mt-20 rounded-3xl bg-gradient-to-r from-[#fae29f] via-[#f5cc6b] to-[#f3bd44] p-8 lg:p-12 shadow-lg"><div class="flex flex-col lg:flex-row lg:items-center justify-between gap-8"><div><h2 class="serif-title text-[#101b3b] text-2xl lg:text-3xl font-bold">Never miss a new resource!</h2><p class="text-[#101b3b]/80 text-sm">Join our WhatsApp community.</p></div><a href="#" target="_blank" class="bg-[#101b3b] text-white font-bold px-8 py-4 rounded-xl text-sm"><i class="fa-brands fa-whatsapp text-xl"></i> Rejoindre</a></div></section></div></main>`; }
function fillResourcesGrid() { const grid = document.getElementById('resourcesGrid'); if (!grid) return; const pdfs = JSON.parse(localStorage.getItem(STORAGE_PDFS)) || []; grid.innerHTML = pdfs.map(p => { const canAccess = canAccessContent(p); return `<div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm"><div class="flex items-center justify-between"><span class="w-9 h-9 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center"><i class="fa-regular fa-file-pdf"></i></span><span class="text-[10px] font-mono bg-gray-100 text-gray-500 px-2 py-0.5 rounded">${p.taille||'PDF'}</span></div><h3 class="font-bold text-[#101b3b] text-base mt-4">${p.nom} ${renderAccessBadge(p)}</h3><div class="mt-6 pt-4 border-t border-gray-50 flex items-center justify-end">${canAccess?`<a href="${p.url}" target="_blank" class="text-[#101b3b] hover:text-[var(--color-gold)] font-bold text-xs">Download <i class="fa-solid fa-arrow-right"></i></a>`:`<button onclick="showPremiumModal()" class="text-[var(--color-gold)] font-bold text-xs"><i class="fa-solid fa-lock"></i> Premium</button>`}</div></div>`; }).join(''); }
function renderMessages() { return `<main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 flex flex-col"><div class="bg-white rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row flex-1 overflow-hidden min-h-[600px] max-h-[750px]"><aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-gray-100 flex flex-col shrink-0"><div class="p-4 border-b border-gray-50"><h3 class="font-bold text-sm text-[#101b3b]">Conversations</h3></div><div class="flex-1 overflow-y-auto custom-scroll divide-y divide-gray-50" id="conversationList"><div class="p-4 bg-gray-50/80 border-l-4 border-[var(--color-gold)] flex items-start gap-3 cursor-pointer" onclick="switchConversation('private')"><div class="relative shrink-0"><div class="w-9 h-9 rounded-xl bg-[#101b3b]/10 text-[#101b3b] flex items-center justify-center font-bold text-sm">AD</div></div><div class="flex-1 min-w-0"><h4 class="font-bold text-xs text-[#101b3b]">Admin Support Desk</h4><p class="text-[11px] text-gray-500">Discussion privée</p></div></div><div class="p-4 flex items-start gap-3 cursor-pointer" onclick="switchConversation('general')"><div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm">🌐</div><div class="flex-1 min-w-0"><h4 class="font-bold text-xs text-[#101b3b]">Groupe Général</h4><p class="text-[11px] text-gray-500">Tous les membres</p></div></div></div></aside><section class="flex-1 flex flex-col bg-gray-50/30"><div class="p-4 bg-white border-b border-gray-100 flex items-center shrink-0" id="chatHeader"><div class="w-9 h-9 rounded-xl bg-[#101b3b] text-[var(--color-gold)] flex items-center justify-center font-bold text-xs" id="chatAvatar">AD</div><div><h3 class="font-bold text-xs lg:text-sm text-[#101b3b]" id="chatTitle">Admin Support Desk</h3><p class="text-[10px] text-green-500" id="chatStatus">En ligne</p></div></div><div class="flex-1 p-6 overflow-y-auto custom-scroll space-y-6" id="messageContainer"><p class="text-center text-sm text-gray-400 py-10">Sélectionnez une conversation</p></div><div class="p-4 bg-white border-t border-gray-100 shrink-0" id="messageInputArea" style="display:none;"><form id="messageForm" class="flex items-center gap-3 bg-gray-50 rounded-xl px-4 py-2.5 border"><input type="text" id="messageInput" placeholder="Message..." class="flex-1 bg-transparent text-xs"><button type="submit" class="bg-[#101b3b] text-white w-8 h-8 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button></form></div></section></div></main>`; }

// ==================== MODALE PROMOTION PREMIUM ====================
function showPremiumModal() { const existing = document.getElementById('premiumPromoModal'); if (existing) existing.remove(); const accessLevel = getUserAccessLevel(); const modal = document.createElement('div'); modal.id = 'premiumPromoModal'; modal.className = 'modal active'; modal.style.zIndex = '150'; modal.innerHTML = `<div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-md w-full mx-4 relative"><button onclick="closePremiumModal()" class="absolute top-4 right-4 text-gray-400 hover:text-[#101b3b] text-xl z-10"><i class="fa-solid fa-xmark"></i></button><div class="bg-gradient-to-r from-[#101b3b] to-[#1a2a56] p-8 text-center text-white"><i class="fa-solid fa-crown text-5xl text-[var(--color-gold)] mb-4"></i><h2 class="serif-title text-2xl font-bold">${accessLevel==='visitor'?'Connectez-vous':'Passez à Premium'}</h2></div><div class="p-6 text-center"><p class="text-slate-600 text-sm mb-6">${accessLevel==='visitor'?'Connectez-vous pour accéder à ce contenu exclusif.':'Débloquez tous les contenus réservés aux membres Premium.'}</p><button onclick="${accessLevel==='visitor'?"openAuthModal('login')":"navigateTo('premium')"}" class="btn-premium px-8 py-3 rounded-full font-bold text-sm">${accessLevel==='visitor'?'Se connecter':'Voir les offres Premium'}</button></div></div>`; document.body.appendChild(modal); modal.addEventListener('click', e => { if (e.target === modal) closePremiumModal(); }); }
function closePremiumModal() { const m = document.getElementById('premiumPromoModal'); if (m) m.remove(); }

// ==================== DASHBOARD ADMIN (simplifié mais fonctionnel) ====================
function renderAdminDashboard() { return `<div class="flex min-h-screen"><aside class="w-72 bg-[#101b3b] text-slate-300 flex flex-col fixed h-full z-50 shadow-xl"><div class="p-6 text-center border-b border-[#1a2a56]"><h2 class="text-white font-bold text-lg">ATA SCHOOL</h2><p class="text-[#c9a03d] text-xs">YES WE CAN</p></div><nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto"><a href="#vue-ensemble" class="flex items-center gap-3 px-4 py-3 text-white bg-[#1a2a56] rounded-xl"><i class="fa-solid fa-chart-pie text-[#c9a03d]"></i> Vue d'ensemble</a><a href="#section-utilisateurs" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#1a2a56] hover:text-white"><i class="fa-solid fa-users-gear text-slate-400"></i> Utilisateurs</a><a href="#section-cours" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#1a2a56] hover:text-white"><i class="fa-solid fa-layer-group text-slate-400"></i> Cours</a><a href="#section-medias" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#1a2a56] hover:text-white"><i class="fa-solid fa-clapperboard text-slate-400"></i> Vidéos</a><a href="#section-pdfs" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#1a2a56] hover:text-white"><i class="fa-solid fa-file-zipper text-slate-400"></i> PDF</a><a href="#section-parametres" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#1a2a56] hover:text-white"><i class="fa-solid fa-gear text-slate-400"></i> Paramètres</a></nav></aside><main class="flex-1 ml-72 p-8 lg:p-10 max-w-[1600px]"><header class="flex justify-between items-center mb-10 pb-5 border-b border-slate-200"><div><h1 class="text-3xl font-extrabold text-[#101b3b]">Tableau de bord</h1></div></header><section id="vue-ensemble" class="grid grid-cols-4 gap-6 mb-10" id="kpiContainer"></section><div id="adminDynamicContent"></div></main></div>`; }
function initAdminDashboard() { const dynamicContent = document.getElementById('adminDynamicContent'); if (dynamicContent) dynamicContent.innerHTML = `<section id="section-utilisateurs" class="glass-card p-6 mb-10"><h2>Utilisateurs</h2><table class="min-w-full"><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Actions</th></tr></thead><tbody id="usersTableBody"></tbody></table></section><section id="section-cours" class="glass-card p-6 mb-10"><h2>Cours</h2><input id="newCourseTitle" placeholder="Titre" class="border p-2 rounded-xl text-sm mb-3 w-full"><input id="newCourseImage" placeholder="URL image" class="border p-2 rounded-xl text-sm mb-3 w-full"><select id="newCourseAccessLevel" class="border p-2 rounded-xl text-sm mb-3 w-full"><option value="public">Public</option><option value="members">Membres</option><option value="premium">Premium</option></select><button id="addCourseBtn" class="btn-navy px-4 py-2 rounded-xl text-sm">Ajouter</button><div id="coursesList" class="mt-4 space-y-2"></div></section><section id="section-parametres" class="glass-card p-6 mb-10"><h2>Paramètres</h2><div class="grid grid-cols-2 gap-4"><input id="settingsFacebook" placeholder="Facebook URL" class="border p-2 rounded-xl text-sm"><input id="settingsWhatsapp" placeholder="WhatsApp" class="border p-2 rounded-xl text-sm"></div><button onclick="window.saveAllSettings()" class="btn-navy px-6 py-2.5 rounded-xl text-sm mt-4">Enregistrer</button></section>`; let courses = JSON.parse(localStorage.getItem(STORAGE_COURSES)) || []; function saveAll() { localStorage.setItem(STORAGE_COURSES, JSON.stringify(courses)); } window.addCourse = () => { const titre = document.getElementById('newCourseTitle').value; if (!titre) return; courses.push({ id: Date.now(), titre, image: document.getElementById('newCourseImage').value, accessLevel: document.getElementById('newCourseAccessLevel').value, views: 0 }); saveAll(); refreshAll(); }; function refreshAll() { document.getElementById('usersTableBody').innerHTML = getUsers().map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td><button onclick="window.deleteUser(${u.id})">🗑</button></td></tr>`).join(''); document.getElementById('coursesList').innerHTML = courses.map(c => `<div class="flex justify-between"><span>${c.titre}</span><button onclick="window.deleteCourse(${c.id})">🗑</button></div>`).join(''); document.getElementById('kpiContainer').innerHTML = `<div class="glass-card p-6">Utilisateurs : ${getUsers().length}</div>`; } window.deleteUser = (id) => { saveUsers(getUsers().filter(u => u.id !== id)); refreshAll(); }; window.deleteCourse = (id) => { courses = courses.filter(c => c.id !== id); saveAll(); refreshAll(); }; window.saveAllSettings = () => { const s = { facebook: document.getElementById('settingsFacebook').value, whatsapp: document.getElementById('settingsWhatsapp').value }; localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s)); updateFooterLinks(); showToast('Paramètres enregistrés'); }; document.getElementById('addCourseBtn')?.addEventListener('click', window.addCourse); refreshAll(); }

// ==================== UPDATE FOOTER ====================
function updateFooterLinks() { const settings = JSON.parse(localStorage.getItem(STORAGE_SETTINGS)) || {}; const container = document.getElementById('footerSocialLinks'); if (!container) return; const links = []; if (settings.facebook) links.push({ href: settings.facebook, icon: 'fa-brands fa-facebook-f' }); if (settings.whatsapp) links.push({ href: `https://wa.me/${settings.whatsapp.replace(/\D/g,'')}`, icon: 'fa-brands fa-whatsapp' }); container.innerHTML = links.length ? links.map(l => `<a href="${l.href}" target="_blank" rel="noopener noreferrer" class="text-[var(--color-gold)] hover:text-white transition text-lg"><i class="${l.icon}"></i></a>`).join('') : '<span class="text-xs text-gray-500">Suivez-nous bientôt</span>'; }

// ==================== MODALE AUTH ====================
function openAuthModal(mode) { document.getElementById('authModal').classList.add('active'); document.getElementById('authFormContainer').innerHTML = `<div class="my-auto py-6 max-w-sm w-full mx-auto"><h1 class="text-2xl font-bold text-[#101b3b] text-center">Connexion</h1><form id="loginForm" class="space-y-4"><input type="email" id="loginEmail" placeholder="Email" class="w-full px-4 py-2.5 border rounded-xl text-xs" required><input type="password" id="loginPassword" placeholder="Mot de passe" class="w-full px-4 py-2.5 border rounded-xl text-xs" required><button type="submit" class="w-full bg-[#101b3b] text-white py-3 rounded-xl font-bold text-xs">Se connecter</button></form></div>`; document.getElementById('loginForm').addEventListener('submit', handleLogin); }
function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
document.getElementById('closeModal').addEventListener('click', closeAuthModal);
document.getElementById('authModal').addEventListener('click', e => { if (e.target === document.getElementById('authModal')) closeAuthModal(); });
function handleLogin(e) { e.preventDefault(); const email = document.getElementById('loginEmail').value.trim().toLowerCase(); const password = document.getElementById('loginPassword').value; const user = getUsers().find(u => u.email === email); if (!user) return alert('Aucun compte trouvé.'); if (user.password !== password) return alert('Mot de passe incorrect.'); setCurrentUser({ fullName: user.name, email: user.email, role: user.role, subscription: user.subscription }); closeAuthModal(); currentPage = 'home'; renderApp(); }

// ==================== SWIPER ====================
let swiperInstance = null;
function initSwiper() { const courses = JSON.parse(localStorage.getItem(STORAGE_COURSES)) || []; const container = document.getElementById('coursesCarouselWrapper'); if (!container) return; container.innerHTML = courses.map(c => `<div class="swiper-slide"><img src="${c.image}" class="w-full h-48 object-cover">${c.accessLevel==='premium'?'<span class="absolute top-3 right-3 bg-[#c9a03d] text-[#101b3b] text-[10px] font-bold px-3 py-1 rounded-full">Premium</span>':''}<div class="p-5"><h3>${c.titre} ${renderAccessBadge(c)}</h3>${canAccessContent(c)?'<button class="btn-premium rounded-full px-4 py-2 text-xs mt-3">Découvrir</button>':'<button onclick="showPremiumModal()" class="bg-[var(--color-gold)] text-[#101b3b] rounded-full px-4 py-2 text-xs mt-3"><i class="fa-solid fa-lock"></i> Premium</button>'}</div></div>`).join(''); if (swiperInstance) { swiperInstance.destroy(true, true); swiperInstance = null; } swiperInstance = new Swiper('.courseSwiper', { effect:'coverflow', grabCursor:true, centeredSlides:true, slidesPerView:'auto', loop:true, coverflowEffect:{ rotate:20, stretch:0, depth:100, modifier:1.4 }, navigation:{ nextEl:'.swiper-button-next', prevEl:'.swiper-button-prev' }, pagination:{ el:'.swiper-pagination', clickable:true }, autoplay:{ delay:1000, disableOnInteraction:false } }); }
function initReveal() { document.querySelectorAll('.reveal').forEach(el => { new IntersectionObserver(e => { if (e[0].isIntersecting) e[0].target.classList.add('visible'); }, { threshold: 0.15 }).observe(el); }); }
function initHeaderScroll() { const header = document.getElementById('mainHeader'); const backBtn = document.getElementById('backToTop'); let lastScroll = window.scrollY; window.onscroll = () => { const y = window.scrollY; if (y > 10) header.classList.add('scrolled'); else header.classList.remove('scrolled'); if (y > lastScroll && y > 60) header.classList.add('hide-nav'); else if (y < lastScroll) header.classList.remove('hide-nav'); lastScroll = y; backBtn.classList.toggle('show', y > 300); }; backBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ==================== MESSAGERIE ====================
let currentConversation = 'private';
window.switchConversation = (conv) => { currentConversation = conv; initMessaging(); };
function initMessaging() { document.getElementById('messageInputArea').style.display = 'block'; document.getElementById('messageForm').onsubmit = e => { e.preventDefault(); const text = document.getElementById('messageInput').value.trim(); if (!text) return; const user = getCurrentUser(); const messages = JSON.parse(localStorage.getItem(`chat_${currentConversation}`)||'[]'); messages.push({ sender: user?.fullName||'Anonyme', text, time: new Date().toLocaleTimeString() }); localStorage.setItem(`chat_${currentConversation}`, JSON.stringify(messages)); document.getElementById('messageInput').value = ''; displayMessages(messages); }; displayMessages(JSON.parse(localStorage.getItem(`chat_${currentConversation}`)||'[]')); }
function displayMessages(messages) { const container = document.getElementById('messageContainer'); if (!container) return; container.innerHTML = messages.map(m => `<div class="flex ${m.sender===getCurrentUser()?.fullName?'justify-end':'justify-start'}"><div class="max-w-[80%] p-3 rounded-2xl ${m.sender===getCurrentUser()?.fullName?'bg-[#101b3b] text-white':'bg-white border'}"><p class="text-xs">${m.text}</p><span class="text-[9px] text-gray-400">${m.time}</span></div></div>`).join(''); container.scrollTop = container.scrollHeight; }

// ==================== MODE SOMBRE ====================
function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.setItem('ata_dark_mode', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }
(function initDarkMode() { if (localStorage.getItem('ata_dark_mode') === 'dark' || (!localStorage.getItem('ata_dark_mode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); })();

// ==================== LANCEMENT ====================
(function() { currentPage = 'home'; renderApp(); })();
</script>
