    <style>

        .swiper { width: 100%; padding-top: 50px; padding-bottom: 70px; }

function getUsers() { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || []; }
function saveUsers(users) { localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }
function getCurrentUser() { return JSON.parse(localStorage.getItem('currentUser')); }
function setCurrentUser(user) { localStorage.setItem('currentUser', JSON.stringify(user)); }
function logout() { if (confirm('Voulez-vous vraiment vous déconnecter ?')) { localStorage.removeItem('currentUser'); currentPage = 'home'; renderApp(); window.scrollTo(0,0); showToast('Vous avez été déconnecté avec succès', 'info'); } }
function getCarouselMode() { return localStorage.getItem('ata_carousel_mode') || 'courses'; }

let currentPage = 'home';

function getUserAccessLevel() {
    const user = getCurrentUser();
    if (!user) return 'visitor';
    if (user.role === 'admin') return 'admin';
    if (user.subscription && user.subscription.status === 'active') {
        if (user.subscription.endDate) {
            const now = new Date(), endDate = new Date(user.subscription.endDate);
            if (endDate > now) return 'premium';
            else { user.subscription.status = 'expired'; setCurrentUser(user); return 'standard'; }
        }
        return 'premium';
    }
    return 'standard';
}

function canAccessContent(content) {
    const accessLevel = getUserAccessLevel();
    const requiredLevel = content.accessLevel || 'public';
    if (accessLevel === 'admin' || accessLevel === 'premium') return true;
    if (accessLevel === 'standard') return requiredLevel === 'public' || requiredLevel === 'members';
    if (accessLevel === 'visitor') return requiredLevel === 'public';
    return false;
}

function renderAccessBadge(content) {
    const level = content.accessLevel || 'public';
    if (level === 'premium') return '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full ml-1">🔒 Premium</span>';
    if (level === 'members') return '<span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full ml-1">👤 Membres</span>';
    return '<span class="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full ml-1">🌐 Public</span>';
}

function canAccessPage(page) {
    const accessLevel = getUserAccessLevel();
    switch (page) {
        case 'home': case 'premium': case 'favorites': return true;
        case 'videos': case 'resources': case 'courses': case 'messages': return accessLevel !== 'visitor';
        default: return true;
    }
}

function checkPageAccess(page) {
    if (!canAccessPage(page)) {
        if (getUserAccessLevel() === 'visitor') openAuthModal('login');
        else showPremiumModal();
        return false;
    }
    return true;
}

function navigateTo(page) {
    if (page === 'home' || page === 'premium' || page === 'favorites') { currentPage = page; renderApp(); return; }
    if (!checkPageAccess(page)) return;
    currentPage = page; renderApp();
}

// ==================== COMPOSANT UPLOAD ====================
function compressImage(file, maxWidth = 800) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
            };
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
async function uploadImage(file, folder = 'general') {
    const compressed = await compressImage(file, 800);
    const filename = `${folder}/${Date.now()}_${Math.random().toString(36).substr(2,6)}.jpg`;
    const storageRef = storage.ref(filename);
    await storageRef.put(compressed);
    return await storageRef.getDownloadURL();
}

async function signInWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
        const result = await auth.signInWithPopup(provider);
        const firebaseUser = result.user;
        const users = getUsers();
        let localUser = users.find(u => u.email === firebaseUser.email);
        if (!localUser) {
            localUser = { id: Date.now(), name: firebaseUser.displayName || firebaseUser.email.split('@')[0], email: firebaseUser.email, photo: firebaseUser.photoURL || '', role: 'student', subscribed: false, subscription: { status: 'none', plan: '', startDate: null, endDate: null }, createdAt: new Date().toISOString(), firebaseUid: firebaseUser.uid };
            users.push(localUser); saveUsers(users);
        }
        setCurrentUser({ fullName: localUser.name, email: localUser.email, role: localUser.role, photo: localUser.photo, subscription: localUser.subscription });
        closeAuthModal(); currentPage = 'home'; renderApp(); showToast(`Bienvenue ${localUser.name} !`);
    } catch (error) {
        if (error.code === 'auth/popup-closed-by-user') return;
        alert('Erreur de connexion Google.');
    }
}

        decorContainer.innerHTML = `<div class="text-center"><i class="fa-solid fa-graduation-cap text-5xl text-[#c9a03d] mb-4"></i><h2 class="text-2xl font-bold">Bienvenue</h2></div>`;
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    } else {
        formContainer.innerHTML = `<div class="my-auto py-6 max-w-sm w-full mx-auto"><h1 class="text-2xl font-bold text-[#101b3b]">Inscription</h1><form id="signupForm" class="space-y-4 mt-6"><input type="text" id="signupName" placeholder="Nom complet" class="w-full px-4 py-2.5 border rounded-xl text-xs" required><input type="email" id="signupEmail" placeholder="Email" class="w-full px-4 py-2.5 border rounded-xl text-xs" required><input type="password" id="signupPassword" placeholder="Mot de passe" class="w-full px-4 py-2.5 border rounded-xl text-xs" required><button type="submit" class="w-full bg-[#101b3b] text-white py-3 rounded-xl font-bold text-xs">S'inscrire</button></form></div>`;
        decorContainer.innerHTML = `<div class="text-center"><i class="fa-solid fa-user-plus text-5xl text-[#c9a03d] mb-4"></i><h2 class="text-2xl font-bold">Rejoignez-nous</h2></div>`;
        document.getElementById('signupForm').addEventListener('submit', handleSignup);
    }
}
function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
document.getElementById('closeModal').addEventListener('click', closeAuthModal);
document.getElementById('authModal').addEventListener('click', e => { if(e.target===document.getElementById('authModal')) closeAuthModal(); });
function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const users = getUsers();
    const user = users.find(u => u.email === email);
    if (!user) return alert('Aucun compte trouvé.');
    if (user.firebaseUid && !user.password) return alert('Utilisez Google.');
    if (user.password !== password) return alert('Mot de passe incorrect.');
    setCurrentUser({ fullName: user.name, email: user.email, role: user.role, photo: user.photo, subscription: user.subscription });
    closeAuthModal(); currentPage = 'home'; renderApp();
}
function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim().toLowerCase();
    const password = document.getElementById('signupPassword').value;
    if (password.length < 8) return alert('8 caractères minimum.');
    const users = getUsers();
    if (users.find(u => u.email === email)) return alert('Email déjà utilisé.');
    const newUser = { id: Date.now(), name, email, password, role: 'student', subscribed: false, photo: '', subscription: { status: 'none' }, createdAt: new Date().toISOString() };
    users.push(newUser); saveUsers(users);
    setCurrentUser({ fullName: name, email, role: 'student', photo: '', subscription: { status: 'none' } });
    closeAuthModal(); currentPage = 'home'; renderApp(); alert('Inscription réussie !');
}

// ==================== SWIPER ====================
let swiperInstance = null;
function initSwiper() {
    const mode = getCarouselMode();
    const container = document.getElementById('coursesCarouselWrapper');
    if (!container) return;
    let slidesHTML = '';
    if (mode === 'custom') {
        const slides = JSON.parse(localStorage.getItem(STORAGE_CAROUSEL)) || [];
        slidesHTML = slides.filter(s=>s.enabled).sort((a,b)=>a.order-b.order).map(s=>`<div class="swiper-slide"><img src="${s.image}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/70 p-6 flex flex-col justify-end text-white"><h3>${s.title}</h3><p>${s.description}</p><a href="${s.buttonLink}" class="bg-[var(--color-gold)] text-[#101b3b] text-xs font-bold px-4 py-2 rounded-full w-fit">${s.buttonText}</a></div></div>`).join('');
    } else {
        const courses = JSON.parse(localStorage.getItem(STORAGE_COURSES)) || [];
        slidesHTML = courses.map(c=>`<div class="swiper-slide"><img src="${c.image}" class="w-full h-48 object-cover">${c.premium?'<span class="absolute top-3 right-3 bg-[#c9a03d] text-[#101b3b] text-[10px] font-bold px-3 py-1 rounded-full">Premium</span>':''}<div class="p-5"><h3>${c.titre} ${renderAccessBadge(c)}</h3><p>${c.prix} - ${c.duree}</p>${canAccessContent(c)?'<button class="btn-premium rounded-full px-4 py-2 text-xs mt-3">Découvrir</button>':'<button onclick="showPremiumModal()" class="bg-[var(--color-gold)] text-[#101b3b] rounded-full px-4 py-2 text-xs mt-3"><i class="fa-solid fa-lock"></i> Premium</button>'}</div></div>`).join('');
    }
    container.innerHTML = slidesHTML;
    if (swiperInstance) { swiperInstance.destroy(true, true); swiperInstance = null; }
    swiperInstance = new Swiper('.courseSwiper', { effect:'coverflow', grabCursor:true, centeredSlides:true, slidesPerView:'auto', loop:true, coverflowEffect:{ rotate:20, stretch:0, depth:100, modifier:1.4 }, navigation:{ nextEl:'.swiper-button-next', prevEl:'.swiper-button-prev' }, pagination:{ el:'.swiper-pagination', clickable:true }, autoplay:{ delay:1000, disableOnInteraction:false } });
}
function initReveal() { document.querySelectorAll('.reveal').forEach(el=>{ new IntersectionObserver(e=>{ if(e[0].isIntersecting) e[0].target.classList.add('visible'); },{threshold:0.15}).observe(el); }); }
function initHeaderScroll() {
    const header = document.getElementById('mainHeader');
    const backBtn = document.getElementById('backToTop');
    let lastScroll = window.scrollY;
    window.onscroll = () => {
        const y = window.scrollY;
        if (y > 10) header.classList.add('scrolled'); else header.classList.remove('scrolled');
        if (y > lastScroll && y > 60) header.classList.add('hide-nav');
        else if (y < lastScroll) header.classList.remove('hide-nav');
        lastScroll = y;
        backBtn.classList.toggle('show', y > 300);
    };
    backBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
}

function initMessaging() {
    document.getElementById('messageInputArea').style.display = 'block';
    const titles = { private:{title:'Admin Support Desk',avatar:'AD'}, general:{title:'Groupe Général',avatar:'🌐'}, premium:{title:'Groupe Premium',avatar:'⭐'} };
    const info = titles[currentConversation];
    document.getElementById('chatTitle').textContent = info.title;
    document.getElementById('chatAvatar').textContent = info.avatar;
    document.getElementById('messageForm').onsubmit = e => {
        e.preventDefault();
        const text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        const user = getCurrentUser();
        const messages = JSON.parse(localStorage.getItem(`chat_${currentConversation}`)||'[]');
        messages.push({ sender: user?.fullName||'Anonyme', text, time: new Date().toLocaleTimeString() });
        localStorage.setItem(`chat_${currentConversation}`, JSON.stringify(messages));
        document.getElementById('messageInput').value = '';
        displayMessages(messages);
    };
    const messages = JSON.parse(localStorage.getItem(`chat_${currentConversation}`)||'[]');
    displayMessages(messages);
}
function displayMessages(messages) {
    const container = document.getElementById('messageContainer');
    if (!container) return;
    container.innerHTML = messages.map(m=>`<div class="flex ${m.sender===getCurrentUser()?.fullName?'justify-end':'justify-start'}"><div class="max-w-[80%] p-3 rounded-2xl ${m.sender===getCurrentUser()?.fullName?'bg-[#101b3b] text-white':'bg-white border'}"><p class="text-xs">${m.text}</p><span class="text-[9px] text-gray-400">${m.time}</span></div></div>`).join('');
    container.scrollTop = container.scrollHeight;
}

// ==================== LANCEMENT ====================
(function() {
    const user = getCurrentUser();
    currentPage = 'home';
    renderApp();
})();
</script>
